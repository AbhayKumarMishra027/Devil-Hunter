<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Devil Survival Shooter</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background: radial-gradient(circle at center, #0b0f1a 0%, #05070d 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      font-family: 'Orbitron', sans-serif;
      color: #eee;
    }

    canvas {
      background: #0e0e0e;
      border: 3px solid #1a1a1a;
      border-radius: 15px;
      box-shadow: 0 0 20px #0ff;
      touch-action: none;
    }

    #overlay {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      display: none;
      animation: fadeIn 1s ease-out;
    }

    #overlay h1 {
      font-size: 50px;
      margin: 10px 0;
      color: #ff2e63;
      text-shadow: 0 0 10px #ff2e63, 0 0 20px #ff2e63;
      letter-spacing: 2px;
    }

    #retryBtn {
      padding: 12px 28px;
      background: linear-gradient(45deg, #222, #333);
      border: 2px solid #555;
      border-radius: 10px;
      cursor: pointer;
      color: #fff;
      font-family: 'Orbitron', sans-serif;
      font-size: 16px;
      box-shadow: 0 0 10px #00f2ff;
      transition: background 0.3s ease, transform 0.2s ease;
    }

    #retryBtn:hover {
      background: #111;
      transform: scale(1.05);
    }

    #gamerText {
      position: absolute;
      bottom: 6px;
      width: 100%;
      text-align: center;
      font-size: 12px;
      color: #0f0;
      font-family: 'Courier New', monospace;
      opacity: 0.7;
      text-shadow: 0 0 5px #0f0;
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: translate(-50%, -60%); }
      100% { opacity: 1; transform: translate(-50%, -50%); }
    }
  </style>
</head>
<body>
  <canvas id="game" width="720" height="480"></canvas>
  <div id="overlay">
    <h1 id="gameOverText">Game Over</h1>
    <button id="retryBtn">Retry</button>
  </div>
  <div id="gamerText">You are a gamer</div>

<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const overlay = document.getElementById("overlay");
  const retryBtn = document.getElementById("retryBtn");

  let W = canvas.width, H = canvas.height;

  let player, bullets, enemies, shockwaves, running, score, startTime, congratsTimer, lastMilestone;
  let keys = {};
  let autoFire = false;
  let mouse = {x: W/2, y: H/2};

  function init() {
    player = {x: W/2, y: H/2, r: 14, speed: 260, health: 100, cooldown: 0};
    bullets = [];
    enemies = [];
    shockwaves = [];
    score = 0;
    startTime = Date.now();
    congratsTimer = 0;
    lastMilestone = 0;
    running = true;
    overlay.style.display = "none";
  }

  function spawnEnemy() {
    const side = Math.floor(Math.random() * 4);
    let x, y;
    if(side===0){x=-20;y=Math.random()*H;}
    else if(side===1){x=W+20;y=Math.random()*H;}
    else if(side===2){x=Math.random()*W;y=-20;}
    else{x=Math.random()*W;y=H+20;}
    enemies.push({x,y,r:16,hp:3,speed:80});
  }

  function shoot(tx,ty) {
    if(player.cooldown>0) return;
    player.cooldown=200;
    const ang=Math.atan2(ty-player.y,tx-player.x);
    bullets.push({x:player.x,y:player.y,vx:Math.cos(ang)*400,vy:Math.sin(ang)*400,r:4});
  }

  function shockwave() {
    if(player.health<=15) return;
    player.health-=15;
    shockwaves.push({x:player.x,y:player.y,r:0,time:0});
  }

  function update(dt) {
    let vx=0, vy=0;
    if(keys["w"]||keys["arrowup"]) vy-=1;
    if(keys["s"]||keys["arrowdown"]) vy+=1;
    if(keys["a"]||keys["arrowleft"]) vx-=1;
    if(keys["d"]||keys["arrowright"]) vx+=1;
    if(vx||vy){const l=Math.hypot(vx,vy);vx/=l;vy/=l;}
    player.x+=vx*player.speed*dt;
    player.y+=vy*player.speed*dt;

    player.x=Math.max(player.r,Math.min(W-player.r,player.x));
    player.y=Math.max(player.r,Math.min(H-player.r,player.y));

    if(autoFire) shoot(mouse.x, mouse.y);
    if(player.cooldown>0) player.cooldown-=dt*1000;

    for(let i=bullets.length-1;i>=0;i--){
      let b=bullets[i];
      b.x+=b.vx*dt; b.y+=b.vy*dt;
      if(b.x<-20||b.x>W+20||b.y<-20||b.y>H+20) bullets.splice(i,1);
    }

    for(let i=enemies.length-1;i>=0;i--){
      let e=enemies[i];
      const ang=Math.atan2(player.y-e.y,player.x-e.x);
      e.x+=Math.cos(ang)*e.speed*dt;
      e.y+=Math.sin(ang)*e.speed*dt;

      if(Math.hypot(player.x-e.x,player.y-e.y)<player.r+e.r){
        player.health-=10;
        enemies.splice(i,1);
        continue;
      }

      for(let j=bullets.length-1;j>=0;j--){
        let b=bullets[j];
        if(Math.hypot(b.x-e.x,b.y-e.y)<b.r+e.r){
          e.hp--;
          bullets.splice(j,1);
          if(e.hp<=0){
            enemies.splice(i,1);
            score+=10;
          }
          break;
        }
      }
    }

    for(let i=shockwaves.length-1;i>=0;i--){
      let s=shockwaves[i];
      s.time+=dt; s.r+=400*dt;
      for(let j=enemies.length-1;j>=0;j--){
        let e=enemies[j];
        if(Math.hypot(e.x-s.x,e.y-s.y)<s.r){
          enemies.splice(j,1);
          score+=10;
        }
      }
      if(s.time>0.4) shockwaves.splice(i,1);
    }

    let elapsed = (Date.now() - startTime) / 1000;
    let spawnRate = Math.min(0.005 + elapsed * 0.0005, 0.05);
    if (Math.random() < spawnRate) spawnEnemy();

    if(score>=lastMilestone+500){
      congratsTimer=2;
      lastMilestone=score;
    }
    if(congratsTimer>0) congratsTimer-=dt;

    if(player.health<=0){
      running=false;
      overlay.style.display="block";
    }
  }

  function render() {
    ctx.clearRect(0,0,W,H);

    ctx.save();
    ctx.shadowColor = "#ffff00";
    ctx.shadowBlur = 25;
    ctx.fillStyle = "#ffff33";
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.fillStyle="#222";
    ctx.fillRect(player.x-3,player.y-14,6,10);

    ctx.save();
    ctx.shadowColor = "#ffffff";
    ctx.shadowBlur = 10;
    ctx.fillStyle = "#ffffff";
    for(const b of bullets){
      ctx.beginPath();
      ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
      ctx.fill();
    }
    ctx.restore();

    ctx.font="24px Arial";
    for(const e of enemies){
      ctx.shadowColor = "#ff0000";
      ctx.shadowBlur = 15;
      ctx.fillStyle = "#ff4444";
      ctx.fillText("😈",e.x-12,e.y+8);
    }

    ctx.strokeStyle="rgba(255,200,50,0.4)";
    ctx.lineWidth = 3;
    for(const s of shockwaves){
      ctx.beginPath();
      ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.stroke();
    }

    ctx.fillStyle="#fff";
    ctx.font="14px Orbitron";
    ctx.fillText("Score: "+score,10,20);
    ctx.fillText("Time: "+Math.floor((Date.now()-startTime)/1000)+"s",10,40);

    ctx.fillStyle = "#333";
    ctx.fillRect(10, 60, 100, 12);
    ctx.fillStyle = "#0f0";
    ctx.fillRect(10, 60, player.health, 12);
    ctx.strokeStyle = "#0f0";
    ctx.strokeRect(10, 60, 100, 12);

    if(congratsTimer>0){
      ctx.fillStyle="#0f0";
      ctx.font="24px Orbitron";
      ctx.fillText("🎉 Milestone Reached! 🎉",W/2-140,H/2);
    }
  }

  let last=0;
  function loop(ts){
    if(!last) last=ts;
    const dt=(ts-last)/1000; last=ts;
    if(running) update(dt);
    render();
    requestAnimationFrame(loop);
  }

  window.addEventListener("keydown",e=>{
    keys[e.key.toLowerCase()]=true;
    if(e.key===" "){shockwave();}
  });
  window.addEventListener("keyup",e=>{keys[e.key.toLowerCase()]=false;});

  canvas.addEventListener("mousedown", e => {
    mouse.x = e.offsetX;
    mouse.y = e.offsetY;
    autoFire = true;
  });
  canvas.addEventListener("mouseup", () => { autoFire = false; });
  canvas.addEventListener("mousemove", e => {
    mouse.x = e.offsetX;
    mouse.y = e.offsetY;
  });

  canvas.addEventListener("touchstart", e => {
    const t = e.touches[0];
    const r = canvas.getBoundingClientRect();
    mouse.x = t.clientX - r.left;
    mouse.y = t.clientY - r.top;
    autoFire = true;
    e.preventDefault();
  });
  canvas.addEventListener("touchend", () => { autoFire = false; });
  canvas.addEventListener("touchmove", e => {
    const t = e.touches[0];
    const r = canvas.getBoundingClientRect();
    mouse.x = t.clientX - r.left;
    mouse.y = t.clientY - r.top;
    e.preventDefault();
  });

  retryBtn.addEventListener("click",()=>init());

  init();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
